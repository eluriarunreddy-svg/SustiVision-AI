<!DOCTYPE html>

<head>

      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              forest: '#0d3823',
              primary: '#14532d',
              emerald: '#059669',
              accent: '#10b981',
              mint: '#d1fae5',
              teal: '#0d9488',

              critical: '#dc2626'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
